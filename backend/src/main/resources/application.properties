spring.application.name=backend

# --- JPA / Hibernate ---
# La base H2 en memoria la configura Spring Boot sola (cada contexto de prueba recibe la suya).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Permite que data.sql se ejecute DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
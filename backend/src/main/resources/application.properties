spring.application.name=backend

# --- Base de datos H2 en memoria ---
# Nombre fijo para poder entrar desde la consola web con la URL jdbc:h2:mem:vent2bebidas
# DB_CLOSE_DELAY=-1 mantiene viva la base mientras la aplicacion este corriendo.
spring.datasource.url=jdbc:h2:mem:vent2bebidas;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Permite que data.sql se ejecute DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Consola web de H2 (http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI (http://localhost:8080/swagger-ui.html) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Seguridad JWT ---
# Clave con la que se firman y verifican los tokens (HS256): minimo 32 caracteres.
# En produccion se entrega con la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET:vent2bebidas-clave-de-desarrollo-cambiar-en-produccion-2026}
# Duracion del token en minutos (fecha de vencimiento = claim "exp").
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}